# HTTPS for suki.zhiyuwujie.top. Caddy takes ports 80 and 443 on the node and gets
# its certificate from Let's Encrypt itself; certificates persist on the node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy
  namespace: synagent
data:
  Caddyfile: |
    {
      email support@heros-agent.space
    }
    suki.zhiyuwujie.top {
      encode gzip
      reverse_proxy synagent-web.synagent.svc.cluster.local:80 {
        flush_interval -1
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: synagent
  labels: { app.kubernetes.io/name: caddy }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: caddy } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: caddy }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: caddy
          image: caddy:2.10
          ports:
            - { containerPort: 80, hostPort: 80 }
            - { containerPort: 443, hostPort: 443 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/caddy }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: caddy }
        - name: data
          hostPath: { path: /var/lib/caddy, type: DirectoryOrCreate }
