# Credentials never appear in a manifest, a command line or an SSM payload. They
# live in AWS Secrets Manager (synagent/prod) and are synced by the External Secrets
# Operator on this node, using the node's IAM role (policy SynagentAccess).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: synagent
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synagent
  namespace: synagent
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: synagent, creationPolicy: Owner }
  data:
    - secretKey: SYN_DATABASE_URL
      remoteRef: { key: synagent/prod, property: SYN_DATABASE_URL }
    - secretKey: SYN_MONGO_URL
      remoteRef: { key: synagent/prod, property: SYN_MONGO_URL }
    - secretKey: SYN_LLM_API_KEY
      remoteRef: { key: synagent/prod, property: SYN_LLM_API_KEY }
    - secretKey: SYN_ADMIN_EMAILS
      remoteRef: { key: synagent/prod, property: SYN_ADMIN_EMAILS }
---
# What the databases themselves read. Separate, so app pods never mount a root login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synagent-db
  namespace: synagent
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: synagent-db, creationPolicy: Owner }
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: synagent/prod, property: POSTGRES_PASSWORD }
    - secretKey: MONGO_INITDB_ROOT_PASSWORD
      remoteRef: { key: synagent/prod, property: MONGO_PASSWORD }
---
# Suki's voice. Separate for the same reason as mail: without it the voice is just off.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synagent-voice
  namespace: synagent
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: synagent-voice, creationPolicy: Owner }
  data:
    - secretKey: SYN_TTS_API_KEY
      remoteRef: { key: synagent/prod, property: SYN_TTS_API_KEY }
---
# The mail relay login, the same platform login the other apps send with. It's a
# separate secret because a missing property fails a whole ExternalSecret, and mail
# must not take the database credentials down with it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synagent-mail
  namespace: synagent
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: synagent-mail, creationPolicy: Owner }
  data:
    - secretKey: SYN_SMTP_USERNAME
      remoteRef: { key: heros/platform, property: smtp-username }
    - secretKey: SYN_SMTP_PASSWORD
      remoteRef: { key: heros/platform, property: smtp-password }
---
# Stripe. Separate because a missing property fails a whole ExternalSecret, and until these
# exist credits simply can't be bought and messages to Suki stay free.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synagent-billing
  namespace: synagent
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: synagent-billing, creationPolicy: Owner }
  data:
    - secretKey: SYN_STRIPE_SECRET_KEY
      remoteRef: { key: synagent/prod, property: SYN_STRIPE_SECRET_KEY }
    - secretKey: SYN_STRIPE_WEBHOOK_SECRET
      remoteRef: { key: synagent/prod, property: SYN_STRIPE_WEBHOOK_SECRET }
---
# WeChat Pay. Separate for the same reason as billing, and off until all of these exist.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synagent-wechat-pay
  namespace: synagent
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: synagent-wechat-pay, creationPolicy: Owner }
  data:
    - secretKey: SYN_WECHAT_MCH_ID
      remoteRef: { key: synagent/prod, property: SYN_WECHAT_MCH_ID }
    - secretKey: SYN_WECHAT_MCH_SERIAL
      remoteRef: { key: synagent/prod, property: SYN_WECHAT_MCH_SERIAL }
    - secretKey: SYN_WECHAT_API_V3_KEY
      remoteRef: { key: synagent/prod, property: SYN_WECHAT_API_V3_KEY }
    - secretKey: SYN_WECHAT_MCH_PRIVATE_KEY
      remoteRef: { key: synagent/prod, property: SYN_WECHAT_MCH_PRIVATE_KEY }
    - secretKey: SYN_WECHAT_PAY_PUBLIC_KEY_ID
      remoteRef: { key: synagent/prod, property: SYN_WECHAT_PAY_PUBLIC_KEY_ID }
    - secretKey: SYN_WECHAT_PAY_PUBLIC_KEY
      remoteRef: { key: synagent/prod, property: SYN_WECHAT_PAY_PUBLIC_KEY }
---
# Google Play Billing. Separate for the same reason as billing, and off until this exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synagent-google-play
  namespace: synagent
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: synagent-google-play, creationPolicy: Owner }
  data:
    - secretKey: SYN_GOOGLE_PLAY_SERVICE_ACCOUNT
      remoteRef: { key: synagent/prod, property: SYN_GOOGLE_PLAY_SERVICE_ACCOUNT }
---
# The mini program itself, for sign-in. Without these, WeChat sign-in stays off.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synagent-wechat-app
  namespace: synagent
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: synagent-wechat-app, creationPolicy: Owner }
  data:
    - secretKey: SYN_WECHAT_APP_ID
      remoteRef: { key: synagent/prod, property: SYN_WECHAT_APP_ID }
    - secretKey: SYN_WECHAT_APP_SECRET
      remoteRef: { key: synagent/prod, property: SYN_WECHAT_APP_SECRET }
---
# Google sign-in. Off until this exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synagent-google-login
  namespace: synagent
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: synagent-google-login, creationPolicy: Owner }
  data:
    - secretKey: SYN_GOOGLE_CLIENT_ID
      remoteRef: { key: synagent/prod, property: SYN_GOOGLE_CLIENT_ID }
