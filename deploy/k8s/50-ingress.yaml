apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: redirect-https, namespace: synagent }
spec:
  redirectScheme: { scheme: https, permanent: true }
---
# Edge rate limit bounds floods. It is generous because the source address may be
# the node's behind k3s's load balancer. Spending is bounded in the app.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: rate-limit, namespace: synagent }
spec:
  rateLimit:
    average: 600
    burst: 300
    period: 1m
    sourceCriterion: { ipStrategy: { depth: 0 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synagent
  namespace: synagent
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: synagent-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: synagent.heros-agent.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: synagent-web, port: { number: 80 } } }
  tls:
    - hosts: [synagent.heros-agent.space]
      secretName: synagent-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synagent-http-redirect
  namespace: synagent
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: synagent-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: synagent.heros-agent.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: synagent-web, port: { number: 80 } } }
