# Postgres and MongoDB, both as containers on this node, each with its own volume.
# Nothing outside this namespace can reach them (60-networkpolicy.yaml), and they are
# backed up nightly to S3 (70-backup.yaml) because a local volume dies with the node.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: synagent
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: synagent
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/component: database }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/component: database }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17.6
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: synagent }
            - { name: POSTGRES_DB, value: synagent }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: synagent-db, key: POSTGRES_PASSWORD } }
          args: ["-c", "shared_buffers=128MB", "-c", "max_connections=60"]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "synagent", "-d", "synagent"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "synagent", "-d", "synagent"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: synagent
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: mongodb }
  ports: [{ name: mongodb, port: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: synagent
  labels: { app.kubernetes.io/name: mongodb, app.kubernetes.io/component: database }
spec:
  serviceName: mongodb
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: mongodb } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mongodb, app.kubernetes.io/component: database }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongodb
          image: mongo:7.0
          args: ["--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
          ports: [{ name: mongodb, containerPort: 27017 }]
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: synagent }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: synagent-db, key: MONGO_INITDB_ROOT_PASSWORD } }
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"] }
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket: { port: mongodb }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /data/db }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 5Gi } }
