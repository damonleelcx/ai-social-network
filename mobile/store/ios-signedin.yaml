# The signed-in app on iOS, against production, with a dedicated test account. It has no
# photo, so it stays in onboarding and is never introduced to anyone.
appId: space.herosagent.synagent
---
- launchApp
# A retry can find it still signed in: the session survives in the keychain.
# iOS reports the input's label twice over, so these match part of it.
- extendedWaitUntil:
    visible: "I already have an account|.*Tell Suki anything.*"
    timeout: 30000
- runFlow:
    when:
      visible: "I already have an account"
    commands:
      - tapOn: "I already have an account"
      - assertVisible: "Welcome back"
      - tapOn:
          text: "Email"
          index: 1
      - inputText: "ios-ci@heros-agent.space"
      - tapOn:
          text: "Password"
          index: 1
      - inputText: ${IOS_TEST_PASSWORD}
      - tapOn: "Sign in"
      # iOS offers to save the password, and the prompt covers the app.
      - extendedWaitUntil:
          visible: "Not Now"
          timeout: 15000
          optional: true
      - tapOn:
          text: "Not Now"
          optional: true
- extendedWaitUntil:
    visible: ".*Tell Suki anything.*"
    timeout: 30000
- takeScreenshot: ios-shots/06-suki

# Talk to Suki: the real model answers, on iOS.
- tapOn: ".*Tell Suki anything.*"
- inputText: "Hi Suki, what can you help me with?"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "this text is never on screen"
    timeout: 30000
    optional: true
- assertVisible: "Hi Suki, what can you help me with?"
- extendedWaitUntil:
    visible: "Hear Suki say this"
    timeout: 90000
- takeScreenshot: ios-shots/07-suki-replied

# Dragging the conversation dismisses the keyboard, which covers the tab bar.
# The tab bar isn't in the iOS accessibility tree here, so its items are found by position.
- swipe:
    start: "50%,25%"
    end: "50%,45%"
- tapOn:
    point: "37%,94%"
- assertVisible: "Good introductions, not endless swiping."
- takeScreenshot: ios-shots/08-matches
- tapOn:
    point: "62%,94%"
- assertVisible: "Dates"
- takeScreenshot: ios-shots/09-dates
- tapOn:
    point: "87%,94%"
- assertVisible: "Edit profile"
- takeScreenshot: ios-shots/10-me
# Settings sits under the tab bar until the page is scrolled, and still counts as visible there.
- scroll
- tapOn: "Settings"
- takeScreenshot: ios-shots/11-settings
# iOS reports each row by its label alone, without the hint under it.
- tapOn: "Suki"
- assertVisible: "Tone"
- takeScreenshot: ios-shots/12-suki-settings
