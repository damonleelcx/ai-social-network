# The signed-in app on iOS, driven by position and checked by its screenshots. Runs after
# ios-signedin, whose session is still in the keychain. No text is read from the screen.
appId: space.herosagent.synagent
---
- launchApp
- extendedWaitUntil:
    visible: "this text is never on screen"
    timeout: 10000
    optional: true
- takeScreenshot: ios-shots/20-suki
- tapOn:
    point: "40%,88%"
- inputText: "Hi Suki, what can you help me with?"
- takeScreenshot: ios-shots/21-typed
- tapOn:
    point: "91%,50%"
    optional: true
- pressKey: Enter
- extendedWaitUntil:
    visible: "this text is never on screen"
    timeout: 45000
    optional: true
- takeScreenshot: ios-shots/22-replied
- swipe:
    start: "50%,25%"
    end: "50%,45%"
- tapOn:
    point: "37%,94%"
- takeScreenshot: ios-shots/23-matches
- tapOn:
    point: "62%,94%"
- takeScreenshot: ios-shots/24-dates
- tapOn:
    point: "87%,94%"
- takeScreenshot: ios-shots/25-me
