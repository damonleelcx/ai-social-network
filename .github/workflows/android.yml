# Builds the signed Android APK, runs it on an emulator against production, and publishes it
# when an android-v* tag is pushed. The landing page links to the latest release's SynAgent.apk.
name: Android

on:
  push:
    tags:
      - "android-v*"
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://match.heros-agent.space
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      # Each build has to outrank the last, or Android refuses the update.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
      - name: Build the release APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon
      # Expo's template signs release builds with the debug key, so sign it properly here.
      - name: Sign it
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias synagent \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out out/SynAgent.apk android/app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/release.p12" out/*.idsig
          "$TOOLS/apksigner" verify --print-certs out/SynAgent.apk | grep -i 'certificate DN'
          "$TOOLS/aapt2" dump badging out/SynAgent.apk | grep -E "^package:"
          ls -la out
          sha256sum out/SynAgent.apk | tee out/SynAgent.apk.sha256
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: mobile
          # One shell per line: the app has to be alive and showing a screen after starting up.
          script: |
            adb install -r out/SynAgent.apk
            adb shell monkey -p space.herosagent.synagent -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > out/launch.png
            adb logcat -d -b crash > out/crash.log
            adb shell pidof space.herosagent.synagent
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/out
          if-no-files-found: warn

  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/SynAgent.apk --repo "$GITHUB_REPOSITORY" --title "SynAgent for Android ${GITHUB_REF_NAME#android-v}" \
            --notes "For adults 18 and over. SHA-256: \`$(cut -d' ' -f1 out/SynAgent.apk.sha256)\`"
