# One-off production bundle for Google Play. The sideload pipeline publishes an APK.
# Play only accepts an app bundle signed with the upload key already in the console.
name: Play bundle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_PUBLIC_API_URL: https://match.heros-agent.space
  EXPO_PUBLIC_PLAY_STORE: "1"
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
  EXPO_NO_TELEMETRY: "1"
  CI: "1"
  APP_VERSION: "1.4.0"
  ANDROID_VERSION_CODE: "10400"

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-v1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Leave sideload installs out of the Play manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app.config.ts")
          t = p.read_text()
          old = "permissions: ['android.permission.REQUEST_INSTALL_PACKAGES'],"
          new = "permissions: [],"
          if old not in t:
              raise SystemExit("permission line not found")
          t = t.replace(old, new, 1)
          old_block = "blockedPermissions: ['android.permission.RECORD_AUDIO'],"
          new_block = "blockedPermissions: ['android.permission.RECORD_AUDIO', 'android.permission.REQUEST_INSTALL_PACKAGES'],"
          if old_block not in t:
              raise SystemExit("blockedPermissions line not found")
          p.write_text(t.replace(old_block, new_block, 1))
          PY
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
      - name: Build the release bundle
        working-directory: mobile/android
        run: ./gradlew :app:bundleRelease --no-daemon
      - name: Sign it with the upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          SRC="android/app/build/outputs/bundle/release/app-release.aab"
          cp "$SRC" "$RUNNER_TEMP/app.aab"
          zip -d "$RUNNER_TEMP/app.aab" 'META-INF/*' || [ $? -eq 12 ]
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEYSTORE_PASSWORD \
            "$RUNNER_TEMP/app.aab" synagent
          mkdir -p out
          cp "$RUNNER_TEMP/app.aab" out/Suki-1.4.0.aab
          rm -f "$RUNNER_TEMP/release.p12"
          keytool -printcert -jarfile out/Suki-1.4.0.aab | grep -E 'Owner:|SHA256:'
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.0/bundletool-all-1.18.0.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle out/Suki-1.4.0.aab \
            | grep -E 'package=|versionCode|versionName|android.permission.REQUEST_INSTALL'
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: play-aab
          path: mobile/out/Suki-1.4.0.aab
          if-no-files-found: error
