# Builds the packages the landing page offers: a self-signed Android APK, tried on an emulator
# against production, and an unsigned iOS IPA. An app-v* tag publishes both as a release, and the
# page links to the latest release's files by name.
#
# Android won't install an APK with no signature at all, so the APK carries our own key. It needs
# no store or account. The IPA has no signature: an iPhone won't install it until a sideloading
# tool signs it with the owner's Apple ID.
name: Packages

on:
  push:
    # Without branches listed, a tags filter stops every branch push from running this.
    branches:
      - main
      - "feat/android-*"
    tags:
      - "app-v*"
    paths:
      - "mobile/**"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_PUBLIC_API_URL: https://match.heros-agent.space
  EXPO_NO_TELEMETRY: "1"
  CI: "1"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      # Each build has to outrank the last, or Android refuses the update.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
      - name: Build the release APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon
      # Expo's template signs release builds with the debug key, so sign it properly here.
      - name: Sign it
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias synagent \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out out/SynAgent.apk android/app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/release.p12" out/*.idsig
          "$TOOLS/apksigner" verify --print-certs out/SynAgent.apk | grep -i 'certificate DN'
          "$TOOLS/aapt2" dump badging out/SynAgent.apk | grep -E "^package:"
          ls -la out
          sha256sum out/SynAgent.apk | tee out/SynAgent.apk.sha256
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: mobile
          # One shell per line: the app has to be alive and showing a screen after starting up.
          # Then pick Korean on Welcome and relaunch. The taps are fixed positions on this 320x640
          # screen, because uiautomator can't read a screen with a looping animation.
          script: |
            adb install -r out/SynAgent.apk
            adb shell monkey -p space.herosagent.synagent -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > out/launch.png
            adb shell input tap 233 53
            sleep 3
            adb exec-out screencap -p > out/language-sheet.png
            adb shell input tap 100 553
            sleep 5
            adb exec-out screencap -p > out/launch-ko.png
            adb shell am force-stop space.herosagent.synagent
            adb shell monkey -p space.herosagent.synagent -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > out/relaunch-ko.png
            adb logcat -d -b crash > out/crash.log
            adb shell pidof space.herosagent.synagent
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/out
          if-no-files-found: warn

  ipa:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: mobile/ios
      - name: Build for iPhone, without signing
        working-directory: mobile/ios
        run: |
          mkdir -p ../out
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" COMPILER_INDEX_STORE_ENABLE=NO \
            build > ../out/xcodebuild.log 2>&1 && ok=1 || ok=0
          grep -nE 'error:|fatal error|BUILD (FAILED|SUCCEEDED)' ../out/xcodebuild.log | head -40 || true
          [ "$ok" = "1" ] || { tail -40 ../out/xcodebuild.log; exit 1; }
      - name: Package the IPA
        run: |
          APP=$(ls -d ios/build/Build/Products/Release-iphoneos/*.app | head -1)
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")"
          # It has to be a real device build, with the JS inside and no signature.
          lipo -archs "$BIN" | grep arm64
          test -f "$APP/main.jsbundle"
          if codesign -v "$APP" 2>/dev/null; then echo "unexpectedly signed"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry out/SynAgent-unsigned.ipa Payload
          ls -la out
          shasum -a 256 out/SynAgent-unsigned.ipa | tee out/SynAgent-unsigned.ipa.sha256
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/out
          if-no-files-found: warn

  release:
    needs: [apk, ipa]
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_SUM=$(cut -d' ' -f1 out/android/SynAgent.apk.sha256)
          IPA_SUM=$(cut -d' ' -f1 out/ios/SynAgent-unsigned.ipa.sha256)
          printf '%s\n' "For adults 18 and over." "" \
            "- **SynAgent.apk**: Android. Install it directly; Android asks you to allow the source. SHA-256: \`$APK_SUM\`" \
            "- **SynAgent-unsigned.ipa**: iOS, not signed. An iPhone won't install it until a sideloading tool signs it with your own Apple ID. SHA-256: \`$IPA_SUM\`" > notes.md
          gh release create "$GITHUB_REF_NAME" out/android/SynAgent.apk out/ios/SynAgent-unsigned.ipa --repo "$GITHUB_REPOSITORY" \
            --title "SynAgent ${GITHUB_REF_NAME#app-v}" --notes-file notes.md
