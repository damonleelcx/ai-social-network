# Builds the native iOS app on a Mac, runs it on an iPhone simulator against production,
# and keeps the screenshots. No Apple account is needed for a simulator build.
name: iOS

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://match.heros-agent.space
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: xcodebuild -version
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: mobile/ios
      - name: Compile the native app
        working-directory: mobile/ios
        run: |
          mkdir -p ../ios-shots
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES COMPILER_INDEX_STORE_ENABLE=NO \
            build > ../ios-shots/xcodebuild.log 2>&1 && ok=1 || ok=0
          grep -nE 'error:|fatal error|BUILD (FAILED|SUCCEEDED)|build commands failed' ../ios-shots/xcodebuild.log | head -40 || true
          tail -25 ../ios-shots/xcodebuild.log
          [ "$ok" = "1" ]
          ls build/Build/Products/Release-iphonesimulator
      - name: Run it on an iPhone simulator
        working-directory: mobile/ios
        run: |
          mkdir -p ../ios-shots
          DEVICE=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9] Pro Max' | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" space.herosagent.synagent
          sleep 25
          xcrun simctl io "$DEVICE" screenshot ../ios-shots/01-launch.png
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          # The app must still be alive after starting up.
          xcrun simctl spawn "$DEVICE" launchctl list | grep -i herosagent
      - name: Drive it with Maestro
        env:
          IOS_TEST_PASSWORD: ${{ secrets.IOS_TEST_PASSWORD }}
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          # Maestro's iOS driver sometimes loses its connection, so each flow gets three tries.
          # An app crash shows up in the crash reports kept below.
          run_flow() {
            for try in 1 2 3; do
              echo "::group::$1, try $try"
              if maestro --device "$DEVICE" test -e IOS_TEST_PASSWORD="$IOS_TEST_PASSWORD" "store/$1.yaml" --format junit --output "ios-shots/$1-$try.xml"; then
                echo "::endgroup::"; echo "PASSED $1 on try $try"; return 0
              fi
              echo "::endgroup::"; echo "FAILED $1 on try $try"
              xcrun simctl io "$DEVICE" screenshot "ios-shots/$1-failed-$try.png" || true
            done
            return 1
          }
          status=0
          run_flow ios-smoke || status=1
          run_flow ios-signedin || status=1
          exit $status
      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p ios-shots/crashes
          find ~/Library/Logs/DiagnosticReports -type f -iname '*synagent*' -exec cp {} ios-shots/crashes/ \; 2>/dev/null || true
          ls -la ios-shots/crashes
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            mobile/ios-shots
            mobile/*.png
            ~/.maestro/tests/**/*.png
          if-no-files-found: warn
          include-hidden-files: true
