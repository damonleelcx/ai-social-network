# Builds the Android App Bundle for Google Play. Unlike the APK in packages.yml, this build leaves
# out the in-app updater and the permission it needs: Play doesn't allow an app to install itself.
name: Play

on:
  push:
    branches:
      - "release/play*"
    tags:
      - "play-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_PUBLIC_API_URL: https://match.heros-agent.space
  EXPO_PUBLIC_PLAY_STORE: "1"
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
  EXPO_NO_TELEMETRY: "1"
  CI: "1"

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      # Each upload has to outrank the last. The offset keeps it above the APK's version codes.
      - run: echo "ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
      - name: The manifest must not ask to install packages
        working-directory: mobile/android
        run: |
          ./gradlew :app:processReleaseMainManifest --no-daemon
          M=app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          [ -f "$M" ] || M=$(find app/build/intermediates -name AndroidManifest.xml -path '*release*' | head -1)
          echo "$M"; grep -n 'uses-permission' "$M"
          grep -q 'REQUEST_INSTALL_PACKAGES' "$M" && grep -B1 -A1 'REQUEST_INSTALL_PACKAGES' "$M" | grep -q 'tools:node="remove"' || ! grep -q 'REQUEST_INSTALL_PACKAGES' "$M"
      - name: Build the bundle
        working-directory: mobile/android
        run: ./gradlew :app:bundleRelease --no-daemon
      # Expo's template signs release builds with the debug key, which Play refuses.
      - name: Sign it with the upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/SynAgent.aab
          zip -qd out/SynAgent.aab 'META-INF/*' || true
          jarsigner -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 out/SynAgent.aab synagent
          keytool -list -v -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD | grep -E 'Valid from|SHA256:' | head -2
          rm -f "$RUNNER_TEMP/release.p12"
          jarsigner -verify out/SynAgent.aab | tail -1
          ls -la out
          sha256sum out/SynAgent.aab | tee out/SynAgent.aab.sha256
      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: mobile/out
